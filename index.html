<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarkServer – Icon Pack</title>
  <meta name="description" content="Complete professional icon pack for DarkServer">
  <meta property="og:title" content="DarkServer Icon Pack">
  <meta property="og:description" content="Android • iOS • PWA • Web • Splash • Variants">
  <meta property="og:image" content="icons/og_image_1200x630.png">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #050507;
      --card: #111116;
      --border: #1e1e26;
      --text: #f0f0f5;
      --muted: #8b8b9a;
      --accent: #3b82f6;
      --red: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }
    .hero {
      text-align: center;
      padding: 4rem 1.5rem 3rem;
      background: radial-gradient(ellipse at top, #0f172a 0%, var(--bg) 70%);
    }
    .hero img.main {
      width: 160px;
      height: 160px;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }
    .hero p {
      color: var(--muted);
      font-size: 1.15rem;
      max-width: 480px;
      margin: 0 auto 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: white;
      padding: 0.85rem 1.6rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(59,130,246,0.3);
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }
    h2 {
      font-size: 1.4rem;
      margin: 3rem 0 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    h2 span { color: var(--muted); font-weight: 400; font-size: 0.95rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      text-align: center;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #333; }
    .card img {
      width: 100%;
      max-width: 120px;
      height: auto;
      border-radius: 16px;
      background: #000;
    }
    .card .label {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .badge-red { color: var(--red); font-weight: 600; }
    .badge-blue { color: var(--blue); font-weight: 600; }
    .wide { grid-column: span 2; }
    @media (max-width: 600px) { .wide { grid-column: span 1; } }
    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="hero">
    <img class="main" src="icons/icon_1024.png" alt="DarkServer Icon">
    <h1>DarkServer</h1>
    <p>Pack d'icônes professionnel complet<br>Android • iOS • PWA • Web • Splash • Variants</p>
    <a class="btn" href="darkserver_icon_pack.zip" download>
      ↓ Télécharger le pack complet
    </a>
  </div>

  <div class="container">
    <h2>Icône principale <span>1024×1024</span></h2>
    <div class="grid">
      <div class="card wide">
        <img src="icons/icon_1024.png" style="max-width:180px" alt="Main icon">
        <div class="label">icon_1024.png</div>
      </div>
    </div>

    <h2>Variantes</h2>
    <div class="grid">
      <div class="card">
        <img src="icons/icon_debug_512.png" alt="Debug">
        <div class="label"><span class="badge-red">Debug</span> — badge D</div>
      </div>
      <div class="card">
        <img src="icons/icon_staff_512.png" alt="Staff">
        <div class="label"><span class="badge-blue">Staff</span> — badge S</div>
      </div>
      <div class="card">
        <img src="icons/maskable-512x512.png" alt="Maskable">
        <div class="label">Maskable 512</div>
      </div>
    </div>

    <h2>Logo & Social</h2>
    <div class="grid">
      <div class="card">
        <img src="icons/darkserver_logo_512.png" alt="Logo">
        <div class="label">Logo 512</div>
      </div>
      <div class="card wide">
        <img src="icons/og_image_1200x630.png" style="max-width:240px;border-radius:8px" alt="OG">
        <div class="label">Open Graph 1200×630</div>
      </div>
    </div>
  </div>

  <footer>
    DarkServer Icon Pack • <a href="https://github.com/projectx667/darkserver-icons">GitHub</a>
  </footer>
</body>
</html>
